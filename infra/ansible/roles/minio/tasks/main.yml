---
- name: Create MinIO group
  group:
    name: minio-user
    state: present

- name: Create MinIO user
  user:
    name: minio-user
    group: minio-user
    shell: /sbin/nologin
    state: present

- name: Create data and config directories
  file:
    path: "{{ item }}"
    state: directory
    owner: minio-user
    group: minio-user
    mode: '0755'
  loop:
    - /usr/local/share/minio
    - /etc/minio

- name: Download MinIO binary
  get_url:
    url: https://dl.min.io/server/minio/release/linux-amd64/minio
    dest: /usr/local/bin/minio
    mode: '0755'

- name: Create MinIO configuration
  template:
    src: minio.conf.j2
    dest: /etc/minio/minio.conf
    owner: minio-user
    group: minio-user
    mode: '0640'
  notify: Restart MinIO

- name: Create systemd service
  template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
  notify: Restart MinIO

- name: Enable and start MinIO
  systemd:
    name: minio
    enabled: yes
    state: started

- name: Download MinIO Client (mc)
  get_url:
    url: https://dl.min.io/client/mc/release/linux-amd64/mc
    dest: /usr/local/bin/mc
    mode: '0755'

- name: Create initial bucket
  shell: |
    /usr/local/bin/mc alias set local http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }}
    /usr/local/bin/mc mb --ignore-existing local/webinar-media
    /usr/local/bin/mc anonymous set public local/webinar-media
  changed_when: false
